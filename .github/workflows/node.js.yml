# Runs lint, formatting checks and tests on every push and pull request to main.
#
# The repository only allows local actions, so this workflow uses no
# `uses:` steps at all: it checks out the code with plain git and runs the
# Node.js that is preinstalled on the GitHub-hosted runner images.

name: Node.js CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the commit
        # GITHUB_SHA is the pushed commit, or the PR merge commit.
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format="Checked out %H %s"
      - name: Show tool versions
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run prettier-check
      - run: npm test
